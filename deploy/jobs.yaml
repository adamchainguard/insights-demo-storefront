apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl
  namespace: storefront
spec:
  selector:
    matchLabels:
      app: curl
  template:
    metadata:
      labels:
        app: curl
    spec:
      containers:
        - name: curl
          image: curlimages/curl:latest
---
