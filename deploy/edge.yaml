apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: storefront
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
---
apiVersion: apps/v1
