apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: storefront
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:latest
---
